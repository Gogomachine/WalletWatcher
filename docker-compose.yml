version: '3.8'

services:
  # PostgreSQL database for production
  postgres:
    image: postgres:15-alpine
    container_name: wallet_watcher_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: wallet_watcher_db
      POSTGRES_USER: wallet_watcher
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_this_password}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet_watcher"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for caching and FSM storage
  redis:
    image: redis:7-alpine
    container_name: wallet_watcher_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Telegram bot (legacy mode with SQLite)
  bot:
    build: .
    container_name: wallet_watcher_bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    environment:
      - DATABASE_PATH=/app/data/bot.db
    profiles:
      - legacy  # Run legacy bot: docker-compose --profile legacy up

  # Telegram bot (optimized mode with PostgreSQL and Redis)
  bot_optimized:
    build: .
    container_name: wallet_watcher_bot_optimized
    restart: unless-stopped
    env_file:
      - .env
    command: python main_optimized.py
    volumes:
      - ./data:/app/data
      - ./screenshots:/app/screenshots
    environment:
      - POSTGRES_URL=postgresql://wallet_watcher:${POSTGRES_PASSWORD:-change_this_password}@postgres:5432/wallet_watcher_db
      - REDIS_URL=redis://redis:6379/0
      - REDIS_FSM_URL=redis://redis:6379/1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Optional: pgAdmin for database management
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: wallet_watcher_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_LISTEN_PORT: 80
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    profiles:
      - tools  # Start with: docker-compose --profile tools up

  # Optional: Redis Commander for Redis management
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: wallet_watcher_redis_commander
    restart: unless-stopped
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      - redis
    profiles:
      - tools  # Start with: docker-compose --profile tools up

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  pgadmin_data:
    driver: local
